<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隨緣聽力 - 會議助理</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card: #15181e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #d99b43;
      --accent-hover: #c58934;
      --danger: #cf4949;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .layout-container {
      display: grid;
      grid-template-columns: 460px 640px;
      gap: 36px;
      width: 100%;
      max-width: 1180px;
      align-items: start;
    }
    @media (max-width: 1000px) {
      .layout-container { grid-template-columns: 1fr; }
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #fff;
    }
    .sub-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .sub-btn:hover { color: #fff; }
    .sub-btn.danger { color: #e06c75; }
    .sub-btn.danger:hover { text-decoration: underline; }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    label { font-size: 0.85rem; color: var(--muted); }
    input, textarea, select {
      background: #0f1217;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 140px;
      line-height: 1.6;
    }
    .time-duration-row {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 16px;
      margin-bottom: 24px;
    }
    .divider {
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin: 10px 0 24px 0;
    }
    .tags-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    
    .add-p-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-add {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0 20px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-add:hover { background: rgba(255, 255, 255, 0.15); }

    .rec-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .rec-circle-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1e222b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rec-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
    }
    .rec-circle-btn.recording .rec-dot {
      background: var(--danger);
      transform: scale(1.15);
    }
    .rec-info-title { font-size: 0.95rem; font-weight: 500; }
    .rec-info-desc { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

    .lang-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 14px;
      margin-bottom: 16px;
    }

    .btn-submit {
      background: var(--accent);
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--accent-hover); }

    .review-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-action-main {
      background: var(--accent);
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    .btn-action-sec {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-action-sec:hover { background: rgba(255, 255, 255, 0.12); }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #232730;
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 10px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 9999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="layout-container">
    
    <!-- 左側直欄：準備與出席者 -->
    <div class="col">
      <div>
        <div class="section-title-row">
          <h2>準備</h2>
          <button type="button" class="sub-btn danger" onclick="resetForm()">刪除此會議</button>
        </div>

        <div class="field-group">
          <label>會議主題</label>
          <input type="text" id="topic" placeholder="這場會議要討論什麼？">
        </div>

        <div class="time-duration-row">
          <div class="field-group" style="margin-bottom:0;">
            <label>時間</label>
            <input type="datetime-local" id="time">
          </div>
          <div class="field-group" style="margin-bottom:0;">
            <label>長度 (分)</label>
            <input type="number" id="duration" placeholder="30">
          </div>
        </div>
      </div>

      <hr class="divider">

      <div>
        <div class="section-title-row">
          <h2>出席者</h2>
        </div>

        <div class="field-group">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <label>常用名冊快速點選：</label>
            <span style="font-size:0.8rem; color:var(--muted); cursor:pointer;" onclick="addAllEmails()">全部加入</span>
          </div>
          <div class="tags-row">
            <span class="pill" onclick="appendEmail('@gmail.com')">@gmail.com</span>
            <span class="pill" onclick="appendEmail('@hotmail.com')">@hotmail.com</span>
            <span class="pill" onclick="appendEmail('@outlook.com')">@outlook.com</span>
          </div>
        </div>

        <div class="add-p-row">
          <input type="text" id="pName" placeholder="姓名" style="flex:1;">
          <input type="email" id="pEmail" placeholder="電子郵件" style="flex:1.4;">
          <button type="button" class="btn-add" onclick="addParticipant()">加入</button>
        </div>

        <div class="field-group">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <label>當前名冊：</label>
            <span class="sub-btn danger" style="font-size:0.8rem;" onclick="clearParticipants()">清空名冊</span>
          </div>
          <div id="participantList" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
        </div>
      </div>
    </div>

    <!-- 右側直欄：收音與審閱上下排列 -->
    <div class="col">
      <!-- 上半：收音 -->
      <div>
        <div class="section-title-row">
          <h2>收音</h2>
          <button type="button" class="sub-btn" onclick="$('#tr').value=''; save(); toast('逐字稿已清除');">清除內容</button>
        </div>

        <div class="rec-box">
          <div class="rec-circle-btn" id="recBtn" onclick="toggleRecording()">
            <div class="rec-dot"></div>
          </div>
          <div>
            <div class="rec-info-title" id="recStatusTitle">待命中</div>
            <div class="rec-info-desc" id="recStatusDesc">按下圓鈕開始講話，文字會即時出現在下方</div>
          </div>
        </div>

        <div class="field-group">
          <textarea id="tr" style="min-height:160px;" placeholder="逐字稿內容會即時出現在這裡，也可直接貼上文字..."></textarea>
        </div>

        <div class="lang-row">
          <div class="field-group" style="margin-bottom:0;">
            <label>收音語言</label>
            <select id="inLang">
              <option value="zh-TW" selected>繁體中文</option>
              <option value="en-US">English</option>
              <option value="ja-JP">日本語</option>
            </select>
          </div>
          <div class="field-group" style="margin-bottom:0;">
            <label>紀錄語言</label>
            <select id="outLang">
              <option value="日本語" selected>日本語</option>
              <option value="繁體中文">繁體中文</option>
              <option value="English">English</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn-submit" id="genBtn" onclick="generateSummary()">
          整理並產出會議紀錄
        </button>
      </div>

      <hr class="divider">

      <!-- 下半：審閱與寄送 -->
      <div>
        <div class="section-title-row">
          <h2>審閱與寄送</h2>
        </div>

        <div class="field-group">
          <textarea id="mn" style="min-height:180px;" placeholder="整理好的內容會出現在這裡，可以直接修改。"></textarea>
        </div>

        <div class="review-actions">
          <button type="button" class="btn-action-main" id="snd" onclick="sendMinutes()">寄送會議紀錄</button>
          <button type="button" class="btn-action-sec" onclick="copyMinutes()">複製全文</button>
          <button type="button" class="btn-action-sec" onclick="clearMinutes()">清除內容</button>
        </div>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw__-GZD8duMmSr1UQ_pD9YFd2ws4MqG09rJilv25xB7wgXNn3XQ_vr_aP2cLUdtaZ29g/exec';

    const $ = s => document.querySelector(s);
    let participants = [];
    let recognition = null;
    let isRecording = false;

    function toast(msg) {
      const t = $('#toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function addParticipant() {
      const n = $('#pName').value.trim();
      const e = $('#pEmail').value.trim();
      if (!e) return toast('請填寫電子郵件');
      participants.push({ name: n || e, email: e });
      $('#pName').value = '';
      $('#pEmail').value = '';
      renderParticipants();
      save();
    }

    function renderParticipants() {
      const pl = $('#participantList');
      pl.innerHTML = '';
      participants.forEach((p, idx) => {
        const sp = document.createElement('span');
        sp.className = 'pill';
        sp.style.color = '#fff';
        sp.innerText = `${p.name} (${p.email}) ×`;
        sp.onclick = () => { participants.splice(idx, 1); renderParticipants(); save(); };
        pl.appendChild(sp);
      });
    }

    function clearParticipants() {
      participants = [];
      renderParticipants();
      save();
    }

    function appendEmail(domain) {
      const inp = $('#pEmail');
      inp.value = (inp.value.split('@')[0] || 'user') + domain;
      inp.focus();
    }

    function addAllEmails() {
      toast('名冊已全數標記');
    }

    function clearMinutes() {
      $('#mn').value = '';
      save();
      toast('內容已清除');
    }

    function copyMinutes() {
      const val = $('#mn').value;
      if (!val) return toast('沒有內容可供複製');
      navigator.clipboard.writeText(val).then(() => toast('全文已複製到剪貼簿'));
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;
      const sr = new SpeechRecognition();
      sr.continuous = true;
      sr.interimResults = true;
      sr.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            $('#tr').value += e.results[i][0].transcript + ' ';
            save();
          }
        }
      };
      sr.onerror = () => toggleRecording(false);
      sr.onend = () => { if (isRecording) sr.start(); };
      return sr;
    }

    function toggleRecording(forceState) {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        return alert('您的瀏覽器不支援即時語音收音功能，請直接貼上文字。');
      }
      if (!recognition) recognition = initSpeechRecognition();

      isRecording = typeof forceState === 'boolean' ? forceState : !isRecording;
      const btn = $('#recBtn');
      if (isRecording) {
        recognition.lang = $('#inLang').value;
        recognition.start();
        btn.classList.add('recording');
        $('#recStatusTitle').innerText = '收音中...';
        $('#recStatusDesc').innerText = '正在即時辨識語音內容';
      } else {
        recognition.stop();
        btn.classList.remove('recording');
        $('#recStatusTitle').innerText = '待命中';
        $('#recStatusDesc').innerText = '按下圓鈕開始講話，文字會即時出現在下方';
      }
    }

    async function generateSummary() {
      const tr = $('#tr').value.trim();
      if (!tr) return toast('請先提供逐字稿內容');

      const btn = $('#genBtn');
      btn.disabled = true;
      btn.innerText = 'AI 整理中，請稍候...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'generate',
            transcript: tr,
            targetLang: $('#outLang').value
          })
        });

        const data = await res.json();
        if (data.status === 'success' && data.summary) {
          $('#mn').value = data.summary;
          save();
          toast('會議紀錄已成功產出');
        } else {
          toast('產出失敗：' + (data.message || '未知錯誤'));
        }
      } catch (err) {
        toast('連線異常，請確認 GAS 網址與權限設定');
      } finally {
        btn.disabled = false;
        btn.innerText = '整理並產出會議紀錄';
      }
    }

    async function sendMinutes() {
      const content = $('#mn').value.trim();
      if (!content) return toast('沒有會議紀錄可供寄送');
      if (participants.length === 0) return toast('請先加入至少一位出席者');

      const snd = $('#snd');
      snd.disabled = true;
      snd.innerText = '信件寄送中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'sendEmail',
            recipients: participants.map(p => p.email),
            subject: '【會議紀錄】' + ($('#topic').value || '隨緣聽力會議紀要'),
            content: content
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          toast('會議紀錄已成功寄出！');
        } else {
          toast('寄送失敗：' + data.message);
        }
      } catch (e) {
        toast('寄送失敗，請確認後台設定');
      } finally {
        snd.disabled = false;
        snd.innerText = '寄送會議紀錄';
      }
    }

    function save() {
      localStorage.setItem('sy_topic', $('#topic').value);
      localStorage.setItem('sy_time', $('#time').value);
      localStorage.setItem('sy_duration', $('#duration').value);
      localStorage.setItem('sy_tr', $('#tr').value);
      localStorage.setItem('sy_mn', $('#mn').value);
      localStorage.setItem('sy_parts', JSON.stringify(participants));
    }

    function load() {
      $('#topic').value = localStorage.getItem('sy_topic') || '';
      $('#time').value = localStorage.getItem('sy_time') || '';
      $('#duration').value = localStorage.getItem('sy_duration') || '';
      $('#tr').value = localStorage.getItem('sy_tr') || '';
      $('#mn').value = localStorage.getItem('sy_mn') || '';
      try {
        participants = JSON.parse(localStorage.getItem('sy_parts')) || [];
        renderParticipants();
      } catch(e) {}
    }

    function resetForm() {
      if (!confirm('確定要清空整場會議所有資料嗎？')) return;
      localStorage.clear();
      location.reload();
    }

    window.onload = load;
  </script>
</body>
</html>
