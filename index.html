<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("mpt"))}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t})()</script>
<title>隨緣聽力｜甩鍋必備版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@200;300;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06070b;--sky:radial-gradient(120% 60% at 50% 0,#10131c 0,#06070b 70%);--ink:#e8e4da;--dim:#9a9da6;--line:rgba(232,228,218,.14);--line2:rgba(232,228,218,.36);--amber:#e3a04c;--hov:#efb363;--on:#14100a;--ph:#7a7d86;--pop:#161922;--bld:#0b0d13;--warn:#e0786a;--star:1;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Songti TC",PMingLiU,serif}
:root[data-theme=light]{color-scheme:light;--bg:#f6f7f9;--sky:radial-gradient(120% 60% at 50% 0,#fff 0,#f6f7f9 70%);--ink:#16181d;--dim:#4f545d;--line:rgba(22,24,29,.14);--line2:rgba(22,24,29,.45);--amber:#b8620a;--hov:#8f4a05;--on:#16100a;--ph:#6b7079;--pop:#fff;--bld:#e1e5ec;--warn:#b3261e;--star:0}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--ink);font:400 16px/1.7 var(--sans);background:var(--sky) no-repeat;position:relative;overflow-x:hidden}
#stars{opacity:var(--star);position:fixed;top:0;left:0;width:1px;height:1px;pointer-events:none}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:40px 28px 0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
h1{font:300 36px/1.3 var(--serif);letter-spacing:.32em;display:flex;align-items:center;gap:0;margin-bottom:2px}
.sub{color:var(--dim);font-size:14px;letter-spacing:.12em;margin:6px 0 0 2px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);padding:8px 2px;outline:0;border-radius:0}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:focus,textarea:focus,select:focus{border-color:var(--amber)}
select option{background:var(--pop)}
textarea{resize:vertical;line-height:1.8;border:1px solid var(--line2);border-radius:6px;padding:12px 14px}
.keybox{display:flex;align-items:center;gap:8px}
#key{max-width:140px;font-size:14px;letter-spacing:.05em}
.hr{display:flex;align-items:center;gap:18px}
.hr .lk{white-space:nowrap}
.hero{text-align:center;padding:84px 0 72px}
.hero p{color:var(--dim);font-size:15px;letter-spacing:.3em}
#cd{font:300 clamp(60px,11vw,128px)/1.1 var(--serif);letter-spacing:.02em;margin:10px 0 8px;font-variant-numeric:tabular-nums}
#cd em{font-style:normal;color:var(--amber);padding:0 .08em;font-weight:200}
#cd u{text-decoration:none;font:300 20px var(--sans);color:var(--dim);margin:0 .6em 0 .15em;letter-spacing:.1em}
#cd .none{font:300 32px var(--serif);color:var(--dim);letter-spacing:.2em;padding:30px 0}
#cm{color:var(--ink);font-size:15px;letter-spacing:.08em;min-height:26px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 72px;padding-bottom:70px}
section{border-top:1px solid var(--line);padding:26px 0 34px}
h2{font:300 19px var(--serif);letter-spacing:.2em;margin-bottom:20px;display:flex;align-items:center;gap:12px}
label,.lb{display:block;color:var(--dim);font-size:14px;letter-spacing:.1em;margin:18px 0 0}
.row{display:flex;gap:18px;align-items:flex-end}
.row>*{flex:1}.row>.sm{flex:0 0 96px}
.btn{cursor:pointer;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:11px 22px;letter-spacing:.14em;font-size:16px;transition:.2s;width:100%}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.main{background:var(--amber);border-color:var(--amber);color:var(--on);font-weight:500}
.btn.main:hover{background:var(--hov);border-color:var(--hov);color:var(--on)}
.btn:disabled{opacity:.5;cursor:wait}
.lk{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;letter-spacing:.08em;padding:0}
.lk:hover{color:var(--amber)}
.bar{display:flex;justify-content:space-between;align-items:baseline}
.acts{display:flex;gap:14px}
#list{margin:-6px 0 12px}
.mi{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-left:2px solid transparent;cursor:pointer;color:var(--dim);transition:.2s}
.mi:hover{color:var(--ink)}
.mi.on{border-color:var(--amber);color:var(--ink);background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 10%,transparent),transparent)}
.mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{font-size:14px;white-space:nowrap}
.cf{margin-left:8px;color:var(--warn);font-weight:400;font-size:13px;border:1px solid var(--warn);border-radius:3px;padding:0 5px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chips span{border:1px solid var(--line2);border-radius:999px;padding:3px 10px 3px 12px;font-size:14px;cursor:pointer;user-select:none;transition:.2s;opacity:.45}
.chips span.selected{opacity:1;border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.chips i{font-style:normal;cursor:pointer;color:var(--dim);padding-left:6px;font-size:16px}
.chips i:hover{color:var(--warn)}

.quick-domains{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick-domains button{border:1px dashed var(--line2);background:none;border-radius:4px;padding:3px 8px;font-size:12px;color:var(--dim);cursor:pointer;transition:.2s}
.quick-domains button:hover{border-color:var(--amber);color:var(--amber)}

.rec{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.rb{width:76px;height:76px;flex:none;border-radius:50%;border:1px solid var(--line2);background:none;display:grid;place-items:center;cursor:pointer;transition:.2s}
.rb:hover{border-color:var(--amber)}
.rb i{width:24px;height:24px;border-radius:50%;background:var(--amber);transition:.2s}
.rb.on{border-color:var(--amber);animation:p 2s infinite}
.rb.on i{border-radius:5px;width:20px;height:20px}
@keyframes p{to{box-shadow:0 0 0 16px transparent}}
.rb{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 30%,transparent)}
.rec b{font:300 17px var(--serif);letter-spacing:.2em;display:block;font-weight:300}
.rec small{color:var(--dim);font-size:14px;letter-spacing:.06em}
.rec .acts{flex-shrink:0;white-space:nowrap}

.dropzone{border:1.5px dashed var(--line2);border-radius:10px;padding:14px 18px;margin-bottom:16px;text-align:center;cursor:pointer;transition:.2s;background:color-mix(in srgb,var(--amber) 3%,transparent)}
.dropzone:hover,.dropzone.drag{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.dropzone b{display:block;font-size:15px;font-weight:400;color:var(--ink);letter-spacing:.08em}
.dropzone small{display:block;font-size:13px;color:var(--dim);margin-top:2px;letter-spacing:.04em}

.evid{display:none;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;border:1px solid var(--amber);border-radius:10px;background:color-mix(in srgb,var(--amber) 8%,transparent);flex-wrap:wrap}
.evid.on{display:flex}
.evid audio{flex:1;min-width:180px;height:34px;outline:none}
.evid .btn{width:auto;padding:6px 14px;font-size:13px;min-height:auto;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.rec-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);margin:0 0 8px;letter-spacing:.06em;flex-wrap:wrap;gap:10px}
.rec-meta b{color:var(--amber);font-weight:400;font-variant-numeric:tabular-nums}
#tx{height:230px}#mn{height:260px}
.sel{display:flex;gap:18px;margin:6px 0 22px}.sel div{flex:1}
.sendrow{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
footer{position:relative;margin-top:20px;height:160px;line-height:0}
#sky{width:100%;height:160px;display:block}
#sky .b{fill:var(--bld)}

:root[data-theme=light] body{font-size:17px}
:root[data-theme=light] .sub,:root[data-theme=light] label,:root[data-theme=light] .lb,:root[data-theme=light] .lk,:root[data-theme=light] .mi small,:root[data-theme=light] .rec small,:root[data-theme=light] .chips span{font-size:15px}
:root[data-theme=light] #cd,:root[data-theme=light] #cd em{font-weight:400}
:root[data-theme=light] #cd u{font-size:20px}
:root[data-theme=light] input,:root[data-theme=light] select{background:#eceef2;border-bottom:2px solid var(--line2);padding:11px 12px;font-size:17px;border-radius:4px 4px 0 0}
:root[data-theme=light] textarea{background:#fff;border:1.5px solid var(--line2);font-size:17px}
:root[data-theme=light] .btn{border:2px solid var(--ink);color:var(--ink);font-size:16px;min-height:50px}
:root[data-theme=light] .btn:hover{background:transparent;border-color:var(--amber);color:var(--amber)}
:root[data-theme=light] .btn.main{background:#e3a04c;border-color:#e3a04c;color:#16100a;font-weight:500}
:root[data-theme=light] .btn.main:hover{background:#eeb35f;border-color:#eeb35f;color:#16100a}
:root[data-theme=light] .evid .btn{min-height:auto;padding:6px 14px;font-size:13px}
:root[data-theme=light] .rb{border:2px solid var(--ink)}
:root[data-theme=light] #toast{background:#16181d;color:#fff;border-color:#16181d}
:root[data-theme=light] section{border-top:0;background:#eceff4;border-radius:14px;padding:26px 28px 30px;margin-bottom:18px}
:root[data-theme=light] section input,:root[data-theme=light] section select{background:#fff}
:root[data-theme=light] .dropzone{background:#fff}
:root[data-theme=light] footer{display:none}
:root[data-theme=light] .wrap{padding-bottom:48px}
:root[data-theme=light] #sky .w{display:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--pop);border:1px solid var(--line2);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:860px){.grid{grid-template-columns:1fr}header{flex-direction:column}.hr{width:100%}#key{flex:1;width:auto;max-width:none}.hero{padding:56px 0 44px}.evid{flex-direction:column;align-items:stretch}}
@media(max-width:600px){
  body{font-size:16px;line-height:1.75}
  .wrap{padding:22px 16px 0}
  h1{font-size:28px;letter-spacing:.18em}
  .sub{font-size:13px;letter-spacing:.06em}
  .hr{gap:12px}
  .hero{padding:36px 0 32px}
  .hero p{font-size:13px;letter-spacing:.18em}
  #cd{font-size:clamp(44px,13vw,64px)}
  #cd u{font-size:16px;margin:0 .35em 0 .1em}
  section{padding:22px 0 26px}
  :root[data-theme=light] section{padding:20px 16px 24px;border-radius:12px}
  h2{font-size:18px;letter-spacing:.12em;margin-bottom:16px}
  input,textarea,select{font-size:16px !important;min-width:0}
  .row{gap:10px}
  .row>.sm{flex:0 0 82px}
  .sel{flex-direction:column;gap:14px}
  .rec{gap:14px}
  .rb{width:64px;height:64px}
  .rec b{font-size:16px;letter-spacing:.1em}
  .rec small{font-size:13px;display:block;line-height:1.45}
  .dropzone{padding:16px 12px}
  .dropzone b{font-size:14px}
  #tx{height:210px}
  #mn{height:240px}
  .sendrow{flex-direction:column;gap:10px}
  .sendrow .btn,.btn{min-height:48px;font-size:15px;padding:12px 16px}
  .chips span{padding:6px 12px 6px 14px;font-size:14px}
  #toast{bottom:18px;font-size:13px;padding:10px 16px;border-radius:14px;text-align:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
<header>
  <div style="display:flex;flex-direction:column;justify-content:center;">
    <h1>隨緣聽力</h1>
    <div class="sub">甩鍋必備版 語音紀錄整理與出席管理</div>
  </div>
  <div class="hr">
    <button class="lk" id="th" type="button"></button>
    <div class="keybox">
      <input id="key" type="password" placeholder="API Key" autocomplete="off" aria-label="API Key">
      <button class="lk" id="tkey" type="button" title="顯示或隱藏金鑰" aria-label="顯示或隱藏金鑰" style="display:inline-flex;align-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="hero">
  <p id="cl">距離下一場會議</p>
  <div id="cd"></div>
  <div id="cm"></div>
</div>

<div class="grid">
<div>
  <section>
    <h2>案發現場設定</h2>
    <div id="list"></div>
    <div class="bar"><button class="lk" id="add">＋ 新增會議</button><button class="lk" id="del">刪除此會議</button></div>
    <label for="ti">會議主題</label>
    <input id="ti" placeholder="今天又要討論什麼沒結論的事？">
    <div class="row">
      <div><label for="tm">時間</label><input id="tm" type="datetime-local"></div>
      <div class="sm"><label for="du">長度（分）</label><input id="du" type="number" min="5" step="5"></div>
    </div>
  </section>
  <section>
    <h2>潛在背鍋名單</h2>
    <div class="row">
      <div><input id="an" placeholder="姓名（留白隨機抽稱號）"></div>
      <div><input id="ae" type="email" placeholder="電子郵件"></div>
      <div class="sm" style="flex-basis:70px"><button class="btn" id="aa" style="padding:8px 0">加入</button></div>
    </div>
    <div class="quick-domains">
      <button type="button" class="qd" data-d="@gmail.com">@gmail.com</button>
      <button type="button" class="qd" data-d="@hotmail.com">@hotmail.com</button>
      <button type="button" class="qd" data-d="@outlook.com">@outlook.com</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="bar"><label for="rc" style="margin-top:26px">鍋子空投地址（逗號或分號分隔）</label><span class="acts" style="margin-top:26px"><button class="lk" id="fill">帶入勾選苦主</button><button class="lk" id="clr">清空</button></span></div>
    <textarea id="rc" rows="3"></textarea>
    <button class="btn" id="inv" style="margin-top:18px">發送鴻門宴召集令（別想裝死）</button>
  </section>
</div>

<div>
  <section>
    <h2>蒐證與側錄</h2>
    <div class="rec">
      <button class="rb" id="rb" aria-label="開始或停止收音"><i></i></button>
      <div><b id="stt">待命中</b><small id="sth">按下圓鈕開始講話，自動標記時間戳記並同步錄製音檔</small></div>
      <div class="acts" style="margin-left:auto">
        <button class="lk" id="cx">清除內容</button>
      </div>
    </div>

    <div class="dropzone" id="dz" role="button" tabindex="0">
      <b>📂 點擊或拖曳錄音檔至此，AI 直接聽寫成逐字稿</b>
      <small>支援 mp3 / m4a / wav / webm / ogg（上限最大 2GB）</small>
      <input type="file" id="upf" accept="audio/*" style="display:none">
    </div>

    <div class="rec-meta">
      <span>收音時長：<b id="rtm">00:00</b></span>
      <span>逐字稿字數：<b id="wct">0</b> 字（點擊 <b style="color:var(--amber)">[分:秒]</b> 可跳轉播放原音）</span>
    </div>
    <div class="evid" id="evid">
      <audio id="aud" controls></audio>
      <a class="btn main" id="dla" download="錄音鐵證.webm">下載錄音鐵證</a>
    </div>
    <textarea id="tx" placeholder="或是貼上大家剛剛死不承認的對話內容…"></textarea>
    <div class="sel">
      <div>
        <label for="l1" style="margin-top:0">收音語言</label>
        <select id="l1">
          <option value="auto" selected>自動偵測 (Auto)</option>
          <option value="zh-TW">正體中文</option>
          <option value="nan-TW">台語 (閩南語 / AI 原音辨識)</option>
          <option value="zh-HK">廣東話 (粵語)</option>
          <option value="en-US">English</option>
          <option value="ja-JP">日本語</option>
          <option value="th-TH">ไทย (Thai)</option>
          <option value="ko-KR">한국어 (Korean)</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </div>
      <div>
        <label for="l2" style="margin-top:0">紀錄語言</label>
        <select id="l2">
          <option selected>正體中文（標準）</option>
          <option>台語（道地台語漢字口吻）</option>
          <option>廣東話</option>
          <option>日本語</option>
          <option>English</option>
          <option>ไทย</option>
          <option>한국어</option>
          <option>Español</option>
          <option>Français</option>
          <option>Deutsch</option>
        </select>
      </div>
    </div>
    <button class="btn main" id="gen">煉成甩鍋生死簿（AI 抓戰犯）</button>
  </section>
  <section>
    <div class="bar">
      <h2>分鍋與昭告天下</h2>
      <div class="acts" style="margin-bottom:20px">
        <span class="lb" style="margin:0" id="who">發送對象：0 人</span>
        <button class="lk" id="cmn">清除內容</button>
      </div>
    </div>
    <textarea id="mn" placeholder="AI 正在幫你把廢話濃縮成『誰該負責』的致命鐵證，請稍候…"></textarea>
    <div class="sendrow">
      <button class="btn" id="snd" style="flex:2">發送抓交替通知書</button>
      <button class="btn" id="dlm" style="flex:1">存成保命護身符</button>
      <button class="btn" id="cp" style="flex:1">複製貼去群組公審</button>
    </div>
  </section>
</div>
</div>
</div>

<footer><svg id="sky" viewBox="0 0 1600 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg></footer>
<div id="toast" role="status"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw__-GZD8duMmSr1UQ_pD9YFd2ws4MqG09rJilv25xB7wgXNn3XQ_vr_aP2cLUdtaZ29g/exec';

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => {
      const res = reader.result || '';
      const base64 = res.split(',')[1] || '';
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function getSafeAudioMime(blob, fileName){
  const raw = ((blob && blob.type) || '').split(';')[0].trim().toLowerCase();
  if(raw && raw !== 'application/octet-stream' && raw !== 'audio/x-m4a') return raw;
  const name = (fileName || '').toLowerCase();
  if(name.endsWith('.m4a') || name.endsWith('.mp4')) return 'audio/mp4';
  if(name.endsWith('.mp3')) return 'audio/mp3';
  if(name.endsWith('.wav')) return 'audio/wav';
  if(name.endsWith('.ogg')) return 'audio/ogg';
  if(name.endsWith('.aac')) return 'audio/aac';
  return 'audio/webm';
}

async function uploadLargeAudioViaFilesAPI(blob, apiKey, displayName){
  const mimeType = getSafeAudioMime(blob, displayName);
  const numBytes = blob.size;
  const startRes = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${encodeURIComponent(apiKey)}`, {
    method: 'POST',
    headers: {
      'X-Goog-Upload-Protocol': 'resumable',
      'X-Goog-Upload-Command': 'start',
      'X-Goog-Upload-Header-Content-Length': String(numBytes),
      'X-Goog-Upload-Header-Content-Type': mimeType,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ file: { display_name: displayName || 'meeting_audio' } })
  });
  if(!startRes.ok){
    const errTxt = await startRes.text();
    throw new Error(`無法啟動大檔案串流上傳 (${startRes.status}): ${errTxt}`);
  }
  const uploadUrl = startRes.headers.get('X-Goog-Upload-URL');
  if(!uploadUrl) throw new Error('無法取得 Google 雲端串流上傳網址');

  const uploadRes = await fetch(uploadUrl, {
    method: 'POST',
    headers: {
      'Content-Length': String(numBytes),
      'X-Goog-Upload-Offset': '0',
      'X-Goog-Upload-Command': 'upload, finalize'
    },
    body: blob
  });
  if(!uploadRes.ok){
    const errTxt = await uploadRes.text();
    throw new Error(`大檔案串流上傳失敗 (${uploadRes.status}): ${errTxt}`);
  }
  const fileInfo = await uploadRes.json();
  let fileObj = fileInfo.file || fileInfo;

  let attempts = 0;
  while(fileObj.state === 'PROCESSING' && attempts < 60){
    await new Promise(r => setTimeout(r, 2000));
    attempts++;
    const checkRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileObj.name}?key=${encodeURIComponent(apiKey)}`);
    if(checkRes.ok){
      fileObj = await checkRes.json();
    }
  }
  if(fileObj.state === 'FAILED') throw new Error('Google 音訊處理失敗，請確認音檔格式是否損毀');
  return fileObj;
}

async function transcribeAudioWithGemini(blob, options = {}){
  const { replaceExisting = false, fileName = '' } = options;
  syncApiKeyInput();
  const apiKey = getCleanApiKey();
  if(!blob || blob.size < 400){
    return toast('音檔過短或沒有聲音，無法聽寫');
  }

  const dz = $('#dz');
  if(dz) dz.style.opacity = '0.6';

  const isLargeFile = blob.size > 15 * 1024 * 1024;
  if(!apiKey && isLargeFile){
    if(dz) dz.style.opacity = '1';
    return toast('⚠️ 超過 15MB 的超長錄音檔，請先在右上角填入 API Key 才能走雲端串流通道喔！');
  }

  toast(!apiKey
    ? '📱 正在透過雲端後台啟動 AI 原音聽寫（免填金鑰），請稍候…'
    : (isLargeFile
      ? `📦 偵測到超長錄音檔（${(blob.size/1024/1024).toFixed(1)} MB），正在串流上傳並由 AI 聽寫中，請稍候…`
      : '🎙️ 正在啟動 Gemini AI 原音聽寫中，請稍候…'));

  let uploadedFileName = '';
  try{
    const l1 = $('#l1').value;
    let langInstruction = '請以道地繁體中文（台灣慣用語）精準聽寫音檔中的所有對話內容。';
    if(l1 === 'nan-TW'){
      langInstruction = '這是一段「台灣閩南語（台語）」或國台語夾雜的對話，請務必直接聽懂原音並使用道地、精準的台語漢字（台灣閩南語推薦用字，例如：毋是、按怎、啥物、遮爾、無要緊、逐家等）完整轉寫逐字稿，切勿翻成英文或亂猜國語諧音。';
    } else if(l1 === 'zh-HK'){
      langInstruction = '這是一段「廣東話（粵語）」對話，請使用道地粵語口語字（例如：唔係、點解、乜嘢、喺度）精準轉寫逐字稿。';
    } else if(l1 === 'en-US'){
      langInstruction = 'Please transcribe the English audio accurately.';
    } else if(l1 === 'ja-JP'){
      langInstruction = '音声を正確な日本語で文字起こししてください。';
    } else if(l1 === 'ko-KR'){
      langInstruction = '오디오를 정확한 한국어로 받아쓰기 해주세요.';
    }

    const promptText = `你是一位專業且精通台灣語言的會議聽寫員。${langInstruction}\n請務必在每一句話開頭加上時間戳記格式，例如 [00:02] 講話內容（若超過一小時則用 [01:05:12]）。只輸出逐字稿本身，不要加任何開場白、說明或 Markdown 符號。若音檔完全無聲請回覆「（無清晰語音）」。`;

    let transcript = '';

    // 通道 A：未填右上角 API Key 時，自動走 GAS 後台藏好的預設金鑰（手機族免設定直接用！）
    if(!apiKey){
      const base64Audio = await blobToBase64(blob);
      const mimeType = getSafeAudioMime(blob, fileName);
      const gasResp = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'transcribe',
          audioBase64: base64Audio,
          mimeType: mimeType,
          prompt: promptText
        })
      });
      const gasData = await gasResp.json();
      if(gasData.error) throw new Error(gasData.error);
      transcript = (gasData.transcript || '').trim();
    } else {
      // 通道 B：有填右上角個人 API Key 時，走直連 / 大檔案串流通道
      let mediaPart = null;
      const safeMime = getSafeAudioMime(blob, fileName);
      if(isLargeFile){
        const fileObj = await uploadLargeAudioViaFilesAPI(blob, apiKey, fileName || 'long_meeting');
        uploadedFileName = fileObj.name;
        mediaPart = { file_data: { mime_type: fileObj.mimeType || safeMime, file_uri: fileObj.uri } };
      } else {
        const base64Audio = await blobToBase64(blob);
        mediaPart = { inline_data: { mime_type: safeMime, data: base64Audio } };
      }

      const models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-flash-latest'];
      let lastErr = '';

      for(const model of models){
        try{
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  mediaPart
                ]
              }]
            })
          });
          const data = await resp.json();
          if(!resp.ok){
            lastErr = data?.error?.message || `HTTP ${resp.status}`;
            continue;
          }
          transcript = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
          if(transcript) break;
        }catch(err){
          lastErr = err.message;
        }
      }

      if(!transcript){
        throw new Error(lastErr || 'AI 未回傳任何文字');
      }
    }

    if(!transcript) throw new Error('AI 未回傳任何文字');

    const box = $('#tx');
    if(replaceExisting || !box.value.trim()){
      box.value = transcript + '\n';
    } else {
      box.value = box.value.trimEnd() + '\n\n' + transcript + '\n';
    }
    committed = box.value;
    cur().tx = box.value;
    updateWordCount();
    save();
    box.scrollTop = box.scrollHeight;
    toast('✨ AI 原音聽寫完成！已自動標記時間戳記（可點擊 [分:秒] 對質）');
  }catch(err){
    console.error('Gemini Audio Transcribe Error:', err);
    toast(`⚠️ AI 聽寫失敗：${err.message}`);
  }finally{
    if(uploadedFileName && apiKey){
      fetch(`https://generativelanguage.googleapis.com/v1beta/${uploadedFileName}?key=${encodeURIComponent(apiKey)}`, { method: 'DELETE' }).catch(()=>{});
    }
    if(dz) dz.style.opacity = '1';
  }
}

function handleExternalAudioFile(file){
  if(!file) return;
  if(file.size > 2 * 1024 * 1024 * 1024){
    return toast('⚠️ 檔案超過 2GB 上限，請先分割音檔再上傳');
  }
  lastAudioBlob = file;
  if(audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = URL.createObjectURL(file);
  $('#aud').src = audioUrl;
  const dla = $('#dla');
  dla.href = audioUrl;
  dla.download = file.name || '匯入錄音鐵證.webm';
  $('#evid').classList.add('on');
  const dt = getFileDateTime();
  cur().recCreatedAt = dt.readable;
  save();
  transcribeAudioWithGemini(file, { replaceExisting: !$('#tx').value.trim(), fileName: file.name });
}

function setSt(on,t,h){
  $('#rb').classList.toggle('on',on);
  $('#stt').textContent=t;
  $('#sth').textContent=h;
}

function stopEvidenceRec(){
  stopRecTimer();
  clearInterval(keepAliveTimer);
  if(mRec && mRec.state !== 'inactive'){
    try{ mRec.stop(); }catch(e){}
  }
  if(mStream){
    mStream.getTracks().forEach(t => t.stop());
    mStream = null;
  }
}

$('#rb').onclick=async ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('這個瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器');
  if(recording){
    recording=false;
    clearInterval(keepAliveTimer);
    if(rec){ try{ rec.stop(); }catch(e){} }
    stopEvidenceRec();
    setSt(false,'待命中','按下圓鈕開始講話，自動標記時間戳記並同步錄製音檔');
    return;
  }

  syncApiKeyInput();
  const selLang = $('#l1').value;
  const isTaiwaneseMode = (selLang === 'nan-TW');
  const textBeforeRec = ($('#tx').value || '').trim();

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      mStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mChunks = [];
      mRec = new MediaRecorder(mStream);
      mRec.ondataavailable = e => { if(e.data && e.data.size > 0) mChunks.push(e.data); };
      mRec.onstop = () => {
        if(!mChunks.length) return;
        const mime = mRec.mimeType || 'audio/webm';
        const ext = mime.includes('mp4') ? 'm4a' : (mime.includes('ogg') ? 'ogg' : 'webm');
        const blob = new Blob(mChunks, { type: mime });
        lastAudioBlob = blob;
        if(audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(blob);
        $('#aud').src = audioUrl;
        const dla = $('#dla');
        dla.href = audioUrl;
        const titleStr = (cur().title || '未命名會議').replace(/[\\/:*?"<>|]/g, '_');
        const dt = getFileDateTime();
        cur().recCreatedAt = dt.readable;
        save();
        dla.download = `${titleStr}_錄音鐵證_${dt.fileTag}.${ext}`;
        $('#evid').classList.add('on');
        toast(`原始錄音鐵證已生成（${dt.readable}），可試聽或下載保存！`);
      };
      mRec.start();
    }catch(err){
      console.warn('背景音檔錄製未啟動:', err);
    }
  }

  committed = $('#tx').value;
  $('#evid').classList.remove('on');
  let lastResultAt = Date.now();
  let sessionStartedAt = Date.now();

  function createAndStartRecognizer(){
    if(!recording) return;
    const r = new SR();
    r.lang = (selLang === 'auto' || isTaiwaneseMode) ? 'zh-TW' : selLang;
    r.continuous = true;
    r.interimResults = true;
    let sessionInterim = '';

    r.onresult = e => {
      lastResultAt = Date.now();
      let interim = '';
      for(let k = e.resultIndex; k < e.results.length; k++){
        const res = e.results[k];
        if(res.isFinal){
          const textChunk = res[0].transcript.trim();
          if(textChunk){
            committed += (committed && !/\n$/.test(committed) ? '\n' : '') + nowStamp() + textChunk + '\n';
          }
        } else {
          interim += res[0].transcript;
        }
      }
      sessionInterim = interim;
      const t = $('#tx');
      t.value = committed + (interim ? nowStamp() + interim : '');
      cur().tx = t.value;
      updateWordCount();
      t.scrollTop = t.scrollHeight;
      save();
    };

    r.onerror = e => {
      if(e.error=='not-allowed'||e.error=='service-not-allowed'){
        recording=false;
        stopEvidenceRec();
        setSt(false,'待命中','按下圓鈕開始講話，自動標記時間戳記並同步錄製音檔');
        toast('麥克風未授權，請在網址列允許存取麥克風');
      }
    };

    r.onend = () => {
      if(sessionInterim.trim()){
        committed += (committed && !/\n$/.test(committed) ? '\n' : '') + nowStamp() + sessionInterim.trim() + '\n';
        sessionInterim = '';
        const t = $('#tx');
        t.value = committed;
        cur().tx = t.value;
        updateWordCount();
        save();
      }
      if(recording){
        setTimeout(()=>{ if(recording) createAndStartRecognizer(); }, 180);
      } else {
        stopEvidenceRec();
        setSt(false,'待命中','按下圓鈕開始講話，自動標記時間戳記並同步錄製音檔');
      }
    };

    rec = r;
    sessionStartedAt = Date.now();
    try{
      r.start();
    }catch(err){
      setTimeout(()=>{ if(recording) createAndStartRecognizer(); }, 400);
    }
  }

  try{
    recording = true;
    createAndStartRecognizer();
    startRecTimer();
    clearInterval(keepAliveTimer);
    keepAliveTimer = setInterval(()=>{
      if(!recording) return;
      const now = Date.now();
      if((now - sessionStartedAt > 12000) || (now - lastResultAt > 7000 && now - sessionStartedAt > 7000)){
        lastResultAt = now;
        sessionStartedAt = now;
        if(rec){
          try{ rec.stop(); }catch(err){ createAndStartRecognizer(); }
        }
      }
    }, 2000);
    setSt(true, isTaiwaneseMode ? '台語雙軌收音中（停止後自動 AI 原音辨識）' : '收音中', '再按一次圓鈕停止收音並生成音檔');
  }catch(e){
    recording = false;
    stopEvidenceRec();
    toast('無法啟動麥克風收音');
  }
};

$('#inv').onclick=()=>{
  const m=cur(),s=new Date(m.time);
  if(isNaN(s))return toast('請先設定會議時間');
  const e=new Date(s.getTime()+m.dur*6e4),f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const to=getValidRecipients();
  const title=m.title||'未命名會議';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SuiyuanHearing//ZH','BEGIN:VEVENT','UID:'+m.id+'@meeting','DTSTAMP:'+f(new Date),'DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+title,'DESCRIPTION:'+encodeURIComponent('會議邀請：'+title),...to.map(a=>'ATTENDEE;CN='+a+':mailto:'+a),'END:VEVENT','END:VCALENDAR'].join('\r\n');

};

$('#gen').onclick=async ()=>{
  const m=cur();
  if(!m.tx.trim())return toast('請先收音或輸入對話內容');
  const b=$('#gen');
  b.disabled=true;
  b.textContent='AI 抓戰犯整理中…';

  const selectedList = (m.att || []).filter(a => a.selected).map(a => a.n);
  const attendeeLine = selectedList.length > 0 ? selectedList.join('、') : '未指定';
  const recTimeStr = m.recCreatedAt || getFileDateTime().readable;

  try{
    const p=`請以${$('#l2').value}為我撰寫一份條理分明的專業會議紀錄（若選擇台語口吻，請使用道地生動且帶點幽默感的台灣閩南語漢字撰寫，保留專業結構但語氣貼近台灣職場實況）。\n`+
      `會議主題：${m.title||'未命名會議'}\n`+
      `會議時間：${tf(m.time)}\n`+
      `錄音建檔時間：${recTimeStr}\n`+
      `出席人員：${attendeeLine}\n\n`+
      `嚴格要求：\n`+
      `1. 僅根據下方「會議逐字稿」的真實內容進行摘要、決議事項與待辦清單（Action Items）整理，並明確標出每項待辦事項的「負責苦主／執行人」（若逐字稿有提及具體人名或職稱請務必點名寫出，沒提及則標註「待指派」）。\n`+
      `2. 絕對不可以憑空編造或加入任何逐字稿中未提及的人名、事件或額外內容。\n`+
      `3. 若出席人員為「未指定」，請如實寫「未指定」。\n`+
      `4. 輸出為純文字格式（勿使用 Markdown 的 ** 粗體符號或 # 標題符號），確保寄送 Email 或複製貼上時版面乾淨整齊。\n\n`+
      `會議逐字稿：\n${m.tx}`;

    const payload = {
      action: 'generate',
      transcript: p,
      targetLang: $('#l2').value
    };
    syncApiKeyInput();
    const customKey = getCleanApiKey();
    if (customKey) payload.customKey = customKey;

    const resp = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    let outText = data.minutes || '';
    if(!outText.includes('錄音建檔時間')){
      outText = `錄音建檔時間：${recTimeStr}\n` + outText;
    }

    m.min = outText;
    $('#mn').value = m.min;
    save();
    toast('甩鍋生死簿已煉成！');
  }catch(e){
    console.error(e);
    toast('整理失敗：' + e.message);
  }finally{
    b.disabled=false;
    b.textContent='煉成甩鍋生死簿（AI 抓戰犯）';
  }
};

$('#snd').onclick=async ()=>{
  const m=cur(),to=getValidRecipients();
  if(!to.length)return toast('請至少選擇或輸入一位鍋子空投對象');
  if(!m.min.trim())return toast('請先煉成或輸入會議紀錄內容');
  const b=$('#snd');
  b.disabled=true;
  b.textContent='發送抓交替通知書中…';
  try{
    const resp = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'send',
        recipients: to.join(','),
        subject: `【會議鐵證紀錄】${m.title||'未命名會議'} (${tf(m.time)})`,
        body: m.min
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    toast(`已成功發送抓交替通知書給 ${to.length} 位苦主！`);
  }catch(e){
    console.error(e);
    toast('發送失敗：' + e.message);
  }finally{
    b.disabled=false;
    b.textContent='發送抓交替通知書';
  }
};

$('#cp').onclick=()=>{
  const val = $('#mn').value;

    navigator.clipboard.writeText(val).then(()=>toast('已複製到剪貼簿，快貼去群組公審！')).catch(()=>{
      $('#mn').select();

    $('#mn').select();

    toast('已複製到剪貼簿');

};
